<div class="container px-5 py-24 mx-auto flex flex-wrap items-center justify-center">
    <form [formGroup]="registerForm"
        class="lg:w-2/6 md:w-1/2 bg-gray-100 rounded-lg p-8 flex flex-col w-full mt-10 md:mt-0">
        <h2 class="text-gray-900 text-lg font-medium title-font mb-5">Create Account</h2>
        <div class="relative mb-4">
            <label for="email" class="leading-7 text-sm text-gray-600">Email</label>
            <input type="email" id="email" name="email" formControlName="username"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <div class="relative mb-4">
            <label for="full-name" class="leading-7 text-sm text-gray-600">Password</label>
            <input type="password" id="full-name" name="full-name" formControlName="password"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        @if (submitted() && !isSamePassword()) {
        <h3 class="text-2xs text-danger">Las contraseñas no coinciden</h3>
        }
        @if (submitted() && registerForm.get('password')?.errors?.['minlength']) {
        <h3 class="text-2xs text-danger">La contraseña es demasiado corta</h3>
        }
        <div class="relative mb-4">
            <label for="full-name" class="leading-7 text-sm text-gray-600">Repeat Password</label>
            <input type="password" id="full-name" name="full-name" formControlName="repeatPassword"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <button (click)="createAccount()"
            class="text-white bg-indigo-500 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-600 rounded text-lg">
            Create Account
        </button>
        <p class="text-xs text-gray-500 mt-3">Do you have an account?
            <a href="http://localhost:9000/login"
                class="text-indigo-500 hover:text-indigo-800 hover:underline cursor-pointer">
                Sign In
            </a>
        </p>
    </form>
</div>
