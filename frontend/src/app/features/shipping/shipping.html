<div class="flex justify-center items-center py-8">
    <ul class="flex items-center gap-0">
        <!--Cart-->
        <li class="bg-indigo-500 w-10 h-10 rounded-full flex justify-center items-center cursor-pointer"
            (click)="goToCart()">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 -960 960 960" width="24px"
                fill="#ffffff">
                <path
                    d="M223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Zm134 280h280-280Z" />
            </svg>
        </li>
        <hr class="w-52 h-2 bg-indigo-500" />
        <!--Shipping-->
        <li class="bg-indigo-500 w-10 h-10 rounded-full flex justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 -960 960 960" fill="#ffffff">
                <path
                    d="M155-227q-35-35-35-85H48v-408q0-29.7 21.15-50.85Q90.3-792 120-792h552v144h120l120 168v168h-72q0 50-35 85t-85 35q-50 0-85-35t-35-85H360q0 50-35 85t-85 35q-50 0-85-35Zm119-51q14-14 14-34t-14-34q-14-14-34-14t-34 14q-14 14-14 34t14 34q14 14 34 14t34-14ZM120-384h24q17-23 42-35.5t54-12.5q29 0 54 12.5t41.53 35.5H600v-336H120v336Zm634 106q14-14 14-34t-14-34q-14-14-34-14t-34 14q-14 14-14 34t14 34q14 14 34 14t34-14Zm-82-178 168-1-85-119h-83v120Zm-310-93Z" />
            </svg>
        </li>
        <hr class="w-52 h-2 bg-gray-500" />
        <!--Payment-->
        <li class="bg-gray-500 w-10 h-10 rounded-full flex justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 -960 960 960" fill="#ffffff">
                <path
                    d="M192-264v-312h72v312h-72Zm252 0v-312h72v312h-72ZM96-144v-72h768v72H96Zm600-120v-312h72v312h-72ZM96-624v-96l384-192 384 192v96H96Zm113-72h542-542Zm0 0h542L480-831 209-696Z" />
            </svg>
        </li>
    </ul>
</div>
<div class="container px-5 mx-auto flex flex-wrap items-center justify-center">
    <form [formGroup]="addressForm" class="lg:w-2/6 md:w-1/2 bg-gray-100 rounded-lg p-8 flex flex-col w-full mt-10 md:mt-0">
        <h2 class="text-gray-900 text-lg font-medium title-font mb-5">Datos de envío</h2>
        <div class="relative mb-4">
            <label for="address" class="leading-7 text-sm text-gray-600">Dirección</label>
            <input type="text" id="address" name="address" formControlName="address"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <div class="relative mb-4">
            <label for="city" class="leading-7 text-sm text-gray-600">Ciudad</label>
            <input type="text" id="city" name="city" formControlName="city"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <div class="relative mb-4">
            <label for="postalCode" class="leading-7 text-sm text-gray-600">Código Postal</label>
            <input type="text" id="postalCode" name="postalCode" formControlName="postalCode"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <div class="relative mb-4">
            <label for="phone" class="leading-7 text-sm text-gray-600">Teléfono</label>
            <input type="text" id="phone" name="phone" formControlName="phone"
                class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
        </div>
        <button (click)="pay()"
            class="text-white bg-indigo-500 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-600 rounded text-lg cursor-pointer">
            Realizar pago
        </button>
    </form>
</div>

<app-chat></app-chat>
