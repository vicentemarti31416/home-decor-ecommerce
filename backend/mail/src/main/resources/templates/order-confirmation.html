<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px;">

                <tr>
                    <td style="padding-bottom:16px;">

                        <!-- Card del pedido -->
                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; background-color:#ffffff;">

                            <!-- Header del pedido -->
                            <tr>
                                <td style="padding:20px; background-color:#f9fafb; border-bottom:1px solid #e5e7eb;">
                                    <table width="100%" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td style="font-family:Arial,sans-serif; font-size:14px; color:#374151;">
                                                Referencia:
                                                <span th:text="${orderResponse.id}" style="color:#111827; font-weight:bold;"></span>
                                            </td>
                                            <td align="center" style="font-family:Arial,sans-serif; font-size:14px; color:#374151;">
                                                Fecha:
                                                <span th:text="${#temporals.format(orderResponse.createdDate, 'dd MMM yyyy')}"
                                                      style="color:#111827; font-weight:bold;"></span>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Productos del pedido -->
                            <tr th:each="product : ${orderResponse.products}">
                                <td style="padding:16px 20px; border-bottom:1px solid #f3f4f6;">
                                    <table width="100%" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td width="100" valign="top">
                                                <img th:src="${product.photo}" width="100" height="100"
                                                     alt="" style="display:block; border-radius:6px; object-fit:cover;"/>
                                            </td>
                                            <td valign="top" style="padding-left:16px; font-family:Arial,sans-serif; color:#111827;">
                                                <p style="margin:0 0 4px 0; font-size:15px; font-weight:bold;"
                                                   th:text="|Nombre: ${product.name}|"></p>
                                                <p style="margin:0 0 4px 0; font-size:13px; color:#6b7280;"
                                                   th:text="|Referencia: ${product.reference}|"></p>
                                                <p style="margin:0 0 4px 0; font-size:13px; color:#374151;"
                                                   th:text="|Precio: ${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} €|"></p>
                                                <p style="margin:0; font-size:13px; color:#374151;"
                                                   th:text="|Cantidad: ${product.quantity}|"></p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                        </table>
                        <!-- Fin card pedido -->

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
