<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="width:600px; max-width:600px; background-color:#f3f4f6; border-radius:8px;">
                <tr>
                    <td align="center" style="padding:32px;">
                        <p style="font-family:Arial,sans-serif; font-size:16px; color:#111827; margin:0 0 24px 0;"
                           th:text="|${message}|">
                        </p>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
