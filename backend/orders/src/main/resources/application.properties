spring.application.name=orders

server.port=8096

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

spring.threads.virtual.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect.version=10.4

#Al arrancar, Hibernate compara el mapeo de tus entidades con el esquema real de la base de datos.
# Si algo no encaja, lanza SchemaManagementException y la aplicación no arranca
spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

rabbitmq.queue.orders.order_confirmation=order_confirmation