spring.application.name=payments

server.port=8097

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

spring.threads.virtual.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

spring.security.oauth2.client.registration.payments-service.client-id=${PAYMENTS_ID}
spring.security.oauth2.client.registration.payments-service.client-secret=${PAYMENTS_SECRET}
spring.security.oauth2.client.registration.payments-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payments-service.scope=internal

spring.security.oauth2.client.provider.payments-service.token-uri=http://localhost:9000/oauth2/token

